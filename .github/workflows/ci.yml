# Typecheck and test on every push to main and every pull request, on each OS and supported
# Node version, so a break on Windows or an older Node shows up before a release does.
# publish.yml calls this too, so nothing reaches npm without the same green matrix.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  # No paths-ignore here: "CI passed" is a required check on main, and a skipped workflow
  # would leave a docs-only pull request waiting on it forever.
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Ubuntu 24.04 blocks the unprivileged namespaces Chrome's sandbox needs; the browser
      # tests would otherwise fail here (not on users' machines).
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm run typecheck
      - run: npm test

  # One stable check for the main-branch ruleset to require, whatever the matrix holds.
  # It runs even when a test job fails, because a skipped required check counts as passed.
  passed:
    name: CI passed
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.test.result != 'success'
        run: |
          echo "The test matrix finished with: ${{ needs.test.result }}."
          exit 1
      - run: echo "Every OS and Node version passed."
